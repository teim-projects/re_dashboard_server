{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="main" style="min-height: 82vh;">
  <div class="container" style="margin-top: 60px;">

    <h4 class="mb-4 text-primary fw-bold">🧮 DSM Table Structure Management</h4>

    <!-- DSM Table Creation Form -->
    <form method="POST" enctype="multipart/form-data" class="border p-4 rounded bg-light shadow-sm">
      {% csrf_token %}
      <div class="row mb-3">
        <div class="col-md-4">
          <label>User</label>
          <select name="selected_user" class="form-select" required>
            <option value="">Select user</option>
            {% for user in users %}
              <option value="{{ user.username }}">{{ user.username }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label>Energy Type</label>
          <select name="energy_type" class="form-select" required>
            <option value="">Select energy type</option>
            {% for e in energy_types %}
              <option value="{{ e.id }}">{{ e.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <label>Structure File</label>
          <input type="file" name="structure_file" class="form-control" accept=".csv,.xls,.xlsx,.xlsm,.ods" required>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Create DSM Table</button>
    </form>

    <!-- DSM Table List -->
    <div class="mt-5">
      <h5 class="text-success fw-bold mb-3">Existing DSM Tables</h5>
      <table class="table table-bordered table-striped">
        <thead class="table-secondary">
          <tr>
            <th>Table Name</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          {% for table in dsm_tables %}
          <tr>
            <td>{{ table }}</td>
            <td>
              <form method="POST" style="display:inline;">
                {% csrf_token %}
                <input type="hidden" name="delete_table_name" value="{{ table }}">
                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
              </form>
            </td>
          </tr>
          {% empty %}
          <tr><td colspan="2">No DSM tables found.</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>

  </div>
</div>
{% endblock %}
