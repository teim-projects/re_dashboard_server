{% extends "basesolar.html" %}
{% load static %}
{% block content %}
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
  /* Page layout */
  .dashboard-header {
    margin-top: 90px; /* keep under header */
    padding: 10px 18px;
    background: linear-gradient(90deg,#0f5598,#0b3f78);
    color:#fff;
    border-radius:12px;
    font-weight:700;
    text-align:center;
    box-shadow: 0 6px 18px rgba(3,37,76,0.12);
  }

  .filters-row {
    display:flex;
    gap:12px;
    align-items:center;
    margin:16px 0;
    flex-wrap:wrap;
  }

  .filter-card {
    background:#ffffff;
    border-radius:12px;
    padding:12px 14px;
    box-shadow: 0 6px 18px rgba(16,64,128,0.06);
    min-width:180px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .filter-label { font-size:12px; color:#57606f; font-weight:600; }
  .filter-control { padding:8px; border-radius:8px; border:1px solid #e6eef8; min-width:120px; }

  .kpis-row { display:flex; gap:12px; margin-left:auto; }
  .kpi-card {
    background: linear-gradient(180deg, #fff, #f7fbff);
    padding:12px 18px; border-radius:12px;
    min-width:160px; text-align:center; box-shadow: 0 6px 14px rgba(11,67,130,0.06);
  }
  .kpi-title { font-size:12px; color:#6b7a90; }
  .kpi-value { font-size:28px; font-weight:800; color:#0b3f78; margin-top:6px; }

  .charts-grid {
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:14px;
    margin-top:12px;
  }

  .card {
    background:#fff; border-radius:12px; padding:12px; box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  }
  .chart-title { font-weight:700; margin-bottom:8px; color:#2b4770; }

  .chart-canvas { width:100%; height:320px; }
  .small-muted { font-size:12px; color:#708090; margin-top:8px; }

  /* legend area */
  .legend { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .legend-item { display:flex; gap:6px; align-items:center; cursor:pointer; user-select:none; padding:6px 8px; border-radius:8px; background:#f4f7fb; }
  .legend-color { width:14px; height:14px; border-radius:3px; }

  /* bottom comparison bar */
  .comparison-card { margin-top:14px; }

  /* tooltip */
  .d3-tooltip {
    position: absolute; pointer-events: none;
    background: rgba(0,0,0,0.8); color: #fff;
    padding:8px 10px; border-radius:6px; font-size:12px;
  }

  .controls-top { display:flex; gap:10px; align-items:center; }
  .btn-reset { background:#e9f2ff; border:1px solid #cfe8ff; padding:8px 12px; border-radius:8px; cursor:pointer; }

  @media (max-width: 900px) {
    .charts-grid { grid-template-columns: 2fr; }
    .kpis-row { margin-top:8px; }
  }
  /* Entire row alignment */
.filters-kpi-row {
  width: 100%;
  padding: 5px 0;
}

/* Floating reset button */
.floating-reset-btn {
  position: absolute;
  right: 20px;
  top: -25px;
  background: #e6eff8;
  color: #003d80;
  border: 1px solid #edf6ff;
   font-size: 13px;
  border-radius: 8px;
  cursor: pointer;
   transition: 0.2s;
}

.floating-reset-btn:hover {
  box-shadow:0px 0px 5px #ffc04a;
}

/* Responsive */
@media (max-width: 992px) {
  .kpis-right {
    margin-top: 10px;
    width: 100%;
    justify-content: flex-start;
  }

  .floating-reset-btn {
     top: 0px !important;
    right: 10px;
  }
}

</style>

<div class="container-fluid">



  <div class="charts-grid mt-3">
    <div class="card">
      <div class="d-flex justify-content-between align-items-center">
        <div class="chart-title">Operating Hours By Year</div>
        <div class="legend" id="legend-op"></div>
      </div>
      <div id="chart-op" class="chart-canvas"></div>
      <div class="small-muted">Avg of operating hours across months</div>
    </div>

    <div class="card">
      <div class="d-flex justify-content-between align-items-center">
        <div class="chart-title">Generation Hours By Year</div>
        <div class="legend" id="legend-gen"></div>
      </div>
      <div id="chart-gen" class="chart-canvas"></div>
      <div class="small-muted">Avg of generation hours across months</div>
    </div>
  </div>

  <div class="comparison-card card">
    <div class="chart-title">Comparison Between Generation And Operating Hours</div>
    <div id="chart-compare" style="height:160px;"></div>
  </div>

  <div id="tooltip" class="d3-tooltip" style="opacity:0;"></div>

</div>
<script>
const API = "{% url 'api_generation_operating' %}";

const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const colorForYear = (y, idx) => ["#0b69a3", "#e66726", "#2ca02c", "#8b5cf6", "#ef476f"][idx % 5];

let state = {
  years: [],
  monthly_by_year: {},
  sites: [],
  selectedYearsGen: new Set(),
  selectedYearsOp: new Set()
};

let firstLoad = true;
const tooltip = d3.select("#tooltip");


// ---------------------------
// MAIN LOAD FUNCTION
// ---------------------------
async function loadAndDraw() {
  const params = new URLSearchParams();

  // Read filters (ALL EMPTY BY DEFAULT)
  const site = document.getElementById("site").value;
  const year = document.getElementById("year").value;
  const month = document.getElementById("month").value;
  const day = document.getElementById("day").value;

  if (site) params.append("site", site);
  if (year) params.append("year", year);
  if (month) params.append("month", month);
  if (day) params.append("day", day);

  const res = await fetch(API + "?" + params.toString());
  const data = await res.json();

  state.years = data.years || [];
  state.monthly_by_year = data.monthly_by_year || {};
  state.sites = data.sites || [];

  // Update dropdowns without resetting user choices
  setOptions();

  // Set KPIs
  document.getElementById("kpi-gen").textContent =
      data.kpis ? (data.kpis.generation_daily_avg || 0) : 0;

  document.getElementById("kpi-op").textContent =
      data.kpis ? (data.kpis.operating_daily_avg || 0) : 0;

  // Default all years selected ONCE only
  if (firstLoad) {
    state.selectedYearsGen = new Set(state.years);
    state.selectedYearsOp = new Set(state.years);
    firstLoad = false;
  }

  drawLineCharts();
  drawComparison(data.comparison || {});
}



// ---------------------------
// PRESERVE FILTER SELECTIONS
// ---------------------------
function setOptions() {
  const siteSel = document.getElementById("site");
  const yearSel = document.getElementById("year");

  const prevSite = siteSel.value;
  const prevYear = yearSel.value;

  // Sites
  siteSel.innerHTML = "<option value=''>All Sites</option>";
  state.sites.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s;
    opt.text = s;
    siteSel.appendChild(opt);
  });

  // Years
  yearSel.innerHTML = "<option value=''>All Years</option>";
  state.years.forEach(y => {
    const opt = document.createElement("option");
    opt.value = y;
    opt.text = y;
    yearSel.appendChild(opt);
  });

  // Restore old values
  siteSel.value = prevSite;
  yearSel.value = prevYear;
}



// ---------------------------
// DRAW BOTH LINE CHARTS
// ---------------------------
function drawLineCharts(){
  drawSingleLine("#chart-op", "op", "#legend-op");
  drawSingleLine("#chart-gen", "gen", "#legend-gen");
}



function drawSingleLine(containerSelector, metricKey, legendSelector){

  const container = d3.select(containerSelector);
  container.selectAll("*").remove();

  const width = container.node().clientWidth;
  const height = container.node().clientHeight || 320;

  const margin = {top:20, right:24, bottom:36, left:48};
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;

  const years = state.years;

  const series = years.map((y, idx) => {
    const months = state.monthly_by_year[y] || [];
    const values = [];

    for (let m = 1; m <= 12; m++) {
      const item = months[m-1] || {};
      const v = metricKey === "gen" ? item.gen : item.op;
      values.push(v === null ? null : +v);
    }

    return {year: y, values, color: colorForYear(y, idx)};
  });

  const allVals = series.flatMap(s => s.values.filter(v => v != null));
  const yMax = allVals.length ? d3.max(allVals) : 1;
  const yMin = allVals.length ? d3.min(allVals) : 0;

  const yPad = Math.max((yMax - yMin) * 0.12, 0.2);

  const x = d3.scaleLinear().domain([1,12]).range([0, innerW]);
  const y = d3.scaleLinear().domain([Math.max(0, yMin - yPad), yMax + yPad]).range([innerH, 0]);

  const svg = container.append("svg").attr("width", width).attr("height", height);
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const xAxis = d3.axisBottom(x).ticks(12).tickFormat(i => MONTHS[i-1]);
  const yAxis = d3.axisLeft(y).ticks(6);

  g.append("g").call(yAxis);
  g.append("g").attr("transform", `translate(0,${innerH})`).call(xAxis);

  g.append("g").selectAll("line.grid")
    .data(y.ticks(6)).enter()
    .append("line")
    .attr("x1",0).attr("x2",innerW)
    .attr("y1",d=>y(d)).attr("y2",d=>y(d))
    .style("stroke", "#e6f0f8");

  const line = d3.line()
    .defined(d => d != null)
    .x((d,i) => x(i+1))
    .y(d => y(d))
    .curve(d3.curveMonotoneX);

  const seriesGroup = g.append("g");

  series.forEach((s, idx) => {

    const path = seriesGroup.append("path")
      .datum(s.values)
      .attr("fill","none")
      .attr("stroke", s.color)
      .attr("stroke-width", 2.5)
      .attr("d", line);

    const total = path.node().getTotalLength();
    path.attr("stroke-dasharray", total)
        .attr("stroke-dashoffset", total)
        .transition().duration(800)
        .attr("stroke-dashoffset", 0);

    seriesGroup.selectAll(".p"+idx)
      .data(s.values.map((v,i)=>({v,i})).filter(d=>d.v!=null))
      .enter().append("circle")
      .attr("cx", d=>x(d.i+1))
      .attr("cy", d=>y(d.v))
      .attr("r",3.5)
      .attr("fill", s.color)
      .attr("stroke","#fff")
      .on("mousemove",(evt,d)=>{
        tooltip.style("opacity",1)
          .style("left",(evt.pageX+10)+"px")
          .style("top",(evt.pageY+10)+"px")
          .html(`<strong>${s.year} - ${MONTHS[d.i]}</strong><br>${metricKey==='gen' ? 'Gen' : 'Op'}: ${d.v}`);
      })
      .on("mouseleave",()=>tooltip.style("opacity",0));
  });

  // ---- Legend
  const legend = d3.select(legendSelector);
  legend.html("");

  years.forEach((y,idx)=>{
    const it = legend.append("div")
      .attr("class","legend-item")
      .on("click",()=>toggleYear(y, metricKey));

    it.append("div")
      .attr("class","legend-color")
      .style("background", colorForYear(y,idx));

    it.append("div").text(y);
  });

  const selectedSet = (metricKey==="gen") ? state.selectedYearsGen : state.selectedYearsOp;

  seriesGroup.selectAll("path")
    .each(function(d,i){
      const yr = years[i];
      d3.select(this).style("opacity", selectedSet.has(yr) ? 0.95 : 0.1);
    });

}



// ---------------------------
// TOGGLE YEAR VISIBILITY
// ---------------------------
function toggleYear(year, key){
  const setRef = key === "gen" ? state.selectedYearsGen : state.selectedYearsOp;
  if(setRef.has(year)) setRef.delete(year);
  else setRef.add(year);
  drawLineCharts();
}



// ---------------------------
// BOTTOM COMPARISON BARS
// ---------------------------
function drawComparison(comparison){
    const container = d3.select("#chart-compare");
    container.selectAll("*").remove();

    const w = container.node().clientWidth;
    const h = 160;

    const svg = container.append("svg").attr("width", w).attr("height", h);

    const margin = {left:120, right:20, top:20, bottom:20};
    const innerW = w - margin.left - margin.right;

    const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

    const gen = +comparison.generation_total || 0;
    const op  = +comparison.operating_total || 0;

    const max = Math.max(gen, op, 1);

    const barH = 26;
    const gap = 24;

    const x = d3.scaleLinear().domain([0,max]).range([0, innerW]);

    const data = [
      {label:"Generation", value:gen, color:"#1f6fb6"},
      {label:"Operating",  value:op,  color:"#002f6c"}
    ];

    g.selectAll("bars")
      .data(data)
      .enter()
      .append("rect")
      .attr("x",0)
      .attr("y",(d,i)=>i*(barH+gap))
      .attr("width",d=>x(d.value))
      .attr("height",barH)
      .attr("rx",8)
      .attr("fill",d=>d.color);

    // left labels
    g.selectAll("labels")
      .data(data)
      .enter()
      .append("text")
      .attr("x",-10)
      .attr("y",(d,i)=>i*(barH+gap)+barH/2+4)
      .attr("text-anchor","end")
      .style("font-size","14px")
      .style("fill","#203a55")
      .text(d=>d.label);

    // value inside
    g.selectAll("values")
      .data(data)
      .enter()
      .append("text")
      .attr("x",d=>x(d.value)-12)
      .attr("y",(d,i)=>i*(barH+gap)+barH/2+4)
      .attr("text-anchor","end")
      .style("font-size","14px")
      .style("fill","white")
      .style("font-weight",600)
      .text(d=>d.value.toLocaleString());
}



// ---------------------------
// FILTER CHANGE EVENTS
// ---------------------------
document.getElementById("site").addEventListener("change", loadAndDraw);
document.getElementById("year").addEventListener("change", loadAndDraw);
document.getElementById("month").addEventListener("change", loadAndDraw);
document.getElementById("day").addEventListener("change", loadAndDraw);

document.getElementById("btn-reset").addEventListener("click", () => {
  document.getElementById("site").value = "";
  document.getElementById("year").value = "";
  document.getElementById("month").value = "";
  document.getElementById("day").value = "";
  loadAndDraw();
});


// ---------------------------
// INITIAL PAGE LOAD
// ---------------------------
loadAndDraw();


// ---------------------------
// RESPONSIVE REDRAW
// ---------------------------
window.addEventListener("resize", ()=>{
  clearTimeout(window._rs);
  window._rs = setTimeout(loadAndDraw, 250);
});
</script>


{% endblock %}
