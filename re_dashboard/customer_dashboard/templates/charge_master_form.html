{% extends "basewind.html" %}
{% block content %}
<div class="container my-4" style="margin-top: 100px !important;">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h5 class="mb-0 text-center">{{ title }}</h5>
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Charge Name</label>
            <input type="text" name="name" value="{{ charge.name|default_if_none:'' }}" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Charge Value</label>
            <input type="number" step="0.0001" name="value" value="{{ charge.value|default_if_none:'' }}" class="form-control" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Unit</label>
            <input type="text" name="unit" value="{{ charge.unit|default_if_none:'' }}" class="form-control">
          </div>
          <div class="col-md-6">
            <label class="form-label">Year</label>
            <input type="number" name="year" value="{{ charge.year|default:2025 }}" class="form-control">
          </div>

          <!-- Optional metadata (only used if your model has these fields) -->
          <div class="col-md-6">
            <label class="form-label">Energy Type (optional)</label>
<select name="energy_type" class="form-select">
  <option value="">-- Any --</option>
  <option value="wind" {% if charge.energy_type == "wind" %}selected{% endif %}>Wind</option>
  <option value="solar" {% if charge.energy_type == "solar" %}selected{% endif %}>Solar</option>
  <option value="other" {% if charge.energy_type == "other" %}selected{% endif %}>Other</option>
</select>

          </div>
          <div class="col-md-6">
            <label class="form-label">State (optional)</label>
            <input type="text" name="state" class="form-control" placeholder="e.g. Maharashtra">
          </div>
        </div>

        <div class="text-center mt-4">
          <button type="submit" class="btn btn-primary px-4">Save</button>
          <a href="{% url 'charge_master_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
